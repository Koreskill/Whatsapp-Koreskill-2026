{% for m in thread %}
<div class="msg msg-{{ m.direction }}">
    <p>{{ m.text }}</p>
    <span class="msg-meta">{{ m.sent_at|default:m.created_at|date:"d/m H:i" }}</span>
</div>
{% empty %}
<p class="thread-empty">Todavía no hay mensajes en esta conversación.</p>
{% endfor %}
{% if send_error %}
<p class="send-error">No se pudo enviar: {{ send_error }}</p>
{% endif %}
