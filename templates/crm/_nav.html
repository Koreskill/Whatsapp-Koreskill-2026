<nav class="app-nav" aria-label="Navegación principal">

    </a>
    <form class="mobile-logout" method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="logout-button" type="submit" title="Cerrar sesión" aria-label="Cerrar sesión">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>

    <div class="nav-group">
        <span class="nav-caption">ESPACIO DE TRABAJO</span>
        <a class="nav-link{% if request.resolver_match.url_name == 'dashboard' %} active{% endif %}" href="{% url 'dashboard' %}">

            <span>Resumen</span>
        </a>
        <a class="nav-link{% if request.resolver_match.url_name == 'chat-list' or request.resolver_match.url_name == 'chat-detail' %} active{% endif %}" href="{% url 'chat-list' %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v9a2.5 2.5 0 0 1-2.5 2.5H9l-5 4V5.5Z"/><path d="M8 8h8M8 12h5"/></svg>

        </a>
        <a class="nav-link{% if request.resolver_match.url_name == 'pipeline-board' %} active{% endif %}" href="{% url 'pipeline-board' %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16M10 4v10M16 4v16M22 4v10"/><circle cx="10" cy="17" r="2"/><circle cx="22" cy="17" r="2"/></svg>

        <a class="nav-link" href="{% url 'admin:crm_agentconfig_changelist' %}">

            <span class="user-info"><strong>{{ request.user.get_full_name|default:request.user.username }}</strong><small>Mi cuenta</small></span>
        </div>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="logout-button" type="submit" title="Cerrar sesión" aria-label="Cerrar sesión">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M16 17l5-5-5-5M21 12H9"/></svg>
            </button>
        </form>
