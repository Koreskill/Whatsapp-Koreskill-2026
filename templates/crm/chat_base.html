{% extends "base.html" %}

{% block body_class %}app{% endblock %}

{% block extra_head %}
<script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
<script>
  function filterConversations(term) {
    term = term.trim().toLowerCase();
    document.querySelectorAll('.conv-item').forEach(function (item) {
      var name = (item.dataset.name || '').toLowerCase();
      item.style.display = !term || name.includes(term) ? '' : 'none';
    });
  }
</script>
{% endblock %}

{% block content %}
{% include "crm/_nav.html" %}
<div class="chat-layout{% if conversation %} has-conversation{% endif %}">
  <aside class="chat-sidebar" aria-label="Conversaciones">
    <div class="sidebar-head">
      <span class="eyebrow">MENSAJES</span>
      <h1>Bandeja</h1>
      <div class="sidebar-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" aria-label="Buscar conversaciones" placeholder="Buscar conversación..." oninput="filterConversations(this.value)">
      </div>
    </div>
    <div id="conversations-list"
      hx-get="{% url 'chat-sidebar' %}{% if conversation %}?active={{ conversation.pk }}{% endif %}"
      hx-trigger="every 6s"
      hx-swap="innerHTML"
      hx-on::after-swap="filterConversations(document.querySelector('.sidebar-search input').value)">
      {% include "crm/_conversations.html" %}
    </div>
  </aside>
  <section class="chat-main" aria-label="Conversación">
    {% block chat_main %}{% endblock %}
  </section>
</div>
{% endblock %}
