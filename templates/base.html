<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CRM Inmobiliario{% endblock %}</title>
    <style>
        :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #f4f6f8; color: #17202a; }
        main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .card { width: min(100%, 400px); background: #fff; border: 1px solid #e5e9ed; border-radius: 14px; padding: 32px; box-shadow: 0 12px 35px rgba(19, 33, 46, .08); }
        h1 { margin: 0 0 8px; font-size: 1.6rem; }
        p { color: #637083; margin: 0 0 24px; }
        label { display: block; margin: 16px 0 6px; font-weight: 600; font-size: .9rem; }
        input { width: 100%; border: 1px solid #cfd6dd; border-radius: 8px; padding: 11px 12px; font: inherit; }
        input:focus { outline: 3px solid #dbeafe; border-color: #2563eb; }
        button { width: 100%; margin-top: 22px; border: 0; border-radius: 8px; padding: 12px; background: #1d4ed8; color: white; font: inherit; font-weight: 700; cursor: pointer; }
        .errorlist { color: #b42318; padding-left: 20px; }
    </style>
</head>
<body>
    <main>{% block content %}{% endblock %}</main>
</body>
</html>
